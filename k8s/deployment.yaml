apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-k8s-lab
  namespace: spring-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-k8s-lab
  template:
    metadata:
      labels:
        app: spring-k8s-lab
    spec:
      containers:
        - name: spring-k8s-lab
          image: spring-k8s-lab:1.0
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080