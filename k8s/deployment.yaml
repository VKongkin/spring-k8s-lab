apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-k8s-lab
  namespace: spring-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-k8s-lab
  template:
    metadata:
      labels:
        app: spring-k8s-lab
    spec:
      containers:
        - name: spring-k8s-lab
          image: spring-k8s-lab:1.1
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5