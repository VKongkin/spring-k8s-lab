# argocd/imageupdater.yaml
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: spring-k8s-lab-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "spring-k8s-lab-helm-dev"
      images:
        - alias: app
          imageName: ghcr.io/vkongkin/spring-k8s-lab
      commonUpdateSettings:
        updateStrategy: newest-build
      writeBackConfig:
        method: git
        gitConfig:
          repository: git@github.com:VKongkin/spring-k8s-lab.git
          branch: main
          writeBackTarget: "helmvalues:/helm/spring-k8s-lab/values.yaml"