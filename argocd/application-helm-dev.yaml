apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-k8s-lab-helm-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/VKongkin/spring-k8s-lab.git
    targetRevision: main
    path: helm/spring-k8s-lab
    helm:
      releaseName: dev
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: spring-lab-helm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true