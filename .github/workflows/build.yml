name: build
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/spring-k8s-lab:${{ steps.meta.outputs.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bump image tag in Helm values
        run: |
          yq -i '.image.tag = "${{ steps.meta.outputs.sha }}"' helm/spring-k8s-lab/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/spring-k8s-lab/values.yaml
          git diff --staged --quiet || git commit -m "chore: bump image to ${{ steps.meta.outputs.sha }} [skip ci]"
          git push