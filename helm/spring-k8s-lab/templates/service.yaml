apiVersion: v1
kind: Service
metadata:
  name: {{ include "spring-k8s-lab.fullname" . }}
  labels:
    {{- include "spring-k8s-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "spring-k8s-lab.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080